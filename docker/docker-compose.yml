services:
  lucidlink-api:
    image: lucidlink/lucidlink-api:1.5.0@sha256:faed972d4191e89dde1e83f32ddb2196f7ce86bbe477172a99de623ca709b831
    container_name: lucidlink-api
    restart: unless-stopped
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3003/api/v1/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  lucidlink-fileservice:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lucidlink-fileservice
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MGMT_API_UPSTREAM=http://lucidlink-api:3003
      # /agent/query LLM (OpenAI-compatible chat/completions). Optional: if unset,
      # /agent/query returns 503. Point at any reachable OpenAI-compatible endpoint.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
    depends_on:
      lucidlink-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
