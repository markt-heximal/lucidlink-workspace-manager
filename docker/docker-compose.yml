name: lucidlink

services:
  lucidlink-api:
    image: lucidlink/lucidlink-api:1.5.7@sha256:78d705e2c62b0572981a73fa599405e2f465d15e6f038a2b971a4ce417225297
    container_name: lucidlink-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3003/api/v1/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  lucidlink-fileservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: lucidlink-fileservice
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MGMT_API_UPSTREAM=http://lucidlink-api:3003
      # /agent/query LLM (OpenAI-compatible chat/completions). Optional: if unset,
      # /agent/query returns 503. Point at any reachable OpenAI-compatible endpoint.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      # Owner sign-in (Supabase session) and the encrypted token vault.
      # See docs/INDEXER.md.
      - VAULT_KEY=${VAULT_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - OWNER_USER_ID=${OWNER_USER_ID:-}
      - INDEXER_URL=http://lucidlink-indexer:8100
      - INDEXER_INTERNAL_KEY=${INDEXER_INTERNAL_KEY:-}
      # LucidLink update monitor (docs/UPDATES.md). Alerts go to every
      # configured channel; leave all blank to only record them.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - UPDATE_CHECK_INTERVAL_SEC=${UPDATE_CHECK_INTERVAL_SEC:-21600}
      - UPDATES_PIN_DIR=/app/pins
      # Per linked filespace cache maximums (GiB): see ll_cache.py.
      - LUCIDLINK_CACHE_DATA_GB=${LUCIDLINK_CACHE_DATA_GB:-5}
      - LUCIDLINK_CACHE_METADATA_GB=${LUCIDLINK_CACHE_METADATA_GB:-1}
    volumes:
      - lucidlink-data:/data
      # Pin files the image does not contain, so the monitor compares against
      # what is actually declared.
      - ./docker-compose.yml:/app/pins/docker-compose.yml:ro
      - ./requirements.txt:/app/pins/requirements.txt:ro
      - ../.mcp.json:/app/pins/.mcp.json:ro
    depends_on:
      lucidlink-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Delta crawler + search/ask/survey. Not published: reached only through the
  # file service's /index/* proxy. Own SDK client, so crawls never block the UI.
  lucidlink-indexer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: lucidlink-indexer
    restart: unless-stopped
    command: ["uvicorn", "indexer.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      - VAULT_KEY=${VAULT_KEY:-}
      - INDEXER_INTERNAL_KEY=${INDEXER_INTERNAL_KEY:-}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_MODEL=${EMBED_MODEL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - RUVECTOR_URL=${RUVECTOR_URL:-}
      - RUVECTOR_API_KEY=${RUVECTOR_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - SYNC_INTERVAL_SEC=${SYNC_INTERVAL_SEC:-300}
      - INDEX_MAX_FILE_BYTES=${INDEX_MAX_FILE_BYTES:-26214400}
      - LUCIDLINK_CACHE_DATA_GB=${LUCIDLINK_CACHE_DATA_GB:-5}
      - LUCIDLINK_CACHE_METADATA_GB=${LUCIDLINK_CACHE_METADATA_GB:-1}
      # Connected block storage (docs/INDEXER.md, In Place, Phase A).
      - BLOCK_SOURCES=${BLOCK_SOURCES:-}
      - BLOCK_SOURCE_WORKSPACE=${BLOCK_SOURCE_WORKSPACE:-}
      # Folders from the app (docs/INDEXER.md): the Mini folders behind the
      # roots and the slots, as plain strings, so the indexer can show them and
      # spot the same folder reached two ways.
      - BLOCK_ROOT_VOLUMES=${BLOCK_ROOT_VOLUMES:-/Volumes}
      - BLOCK_ROOT_ICLOUD=${BLOCK_ROOT_ICLOUD:-}
      - BLOCK_ROOT_DESKTOP=${BLOCK_ROOT_DESKTOP:-}
      - BLOCK_ROOT_DOCUMENTS=${BLOCK_ROOT_DOCUMENTS:-}
      - BLOCK_SOURCE_PATH=${BLOCK_SOURCE_PATH:-}
      - BLOCK_SOURCE_PATH_2=${BLOCK_SOURCE_PATH_2:-}
      - BLOCK_SOURCE_PATH_3=${BLOCK_SOURCE_PATH_3:-}
      - BLOCK_SOURCE_PATH_4=${BLOCK_SOURCE_PATH_4:-}
      - BLOCK_SOURCE_PATH_5=${BLOCK_SOURCE_PATH_5:-}
      - BLOCK_SOURCE_PATH_6=${BLOCK_SOURCE_PATH_6:-}
    volumes:
      - lucidlink-data:/data
      # Up to six folders (NAS shares, drives, iCloud Drive, Desktop) indexed
      # in place, each in its own read-only slot so the container sees only
      # those folders. Unset slots mount an empty placeholder. Name them in
      # BLOCK_SOURCES, e.g. "UGREEN-personal=/block/source1;iCloud=/block/source4".
      - ${BLOCK_SOURCE_PATH:-./block-empty}:/block/source1:ro
      - ${BLOCK_SOURCE_PATH_2:-./block-empty}:/block/source2:ro
      - ${BLOCK_SOURCE_PATH_3:-./block-empty}:/block/source3:ro
      - ${BLOCK_SOURCE_PATH_4:-./block-empty}:/block/source4:ro
      - ${BLOCK_SOURCE_PATH_5:-./block-empty}:/block/source5:ro
      - ${BLOCK_SOURCE_PATH_6:-./block-empty}:/block/source6:ro
      # Places the owner browses from the app to connect folders without a
      # restart: every drive and share mounted on the Mini, iCloud Drive,
      # Desktop and Documents. Read-only; the indexer reads only the folders chosen in the app.
      - ${BLOCK_ROOT_VOLUMES:-/Volumes}:/host/volumes:ro
      - ${BLOCK_ROOT_ICLOUD:-./block-empty}:/host/icloud:ro
      - ${BLOCK_ROOT_DESKTOP:-./block-empty}:/host/desktop:ro
      - ${BLOCK_ROOT_DOCUMENTS:-./block-empty}:/host/documents:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  lucidlink-data:
