name: lucidlink

services:
  lucidlink-api:
    image: lucidlink/lucidlink-api:1.5.7@sha256:78d705e2c62b0572981a73fa599405e2f465d15e6f038a2b971a4ce417225297
    container_name: lucidlink-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3003/api/v1/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  lucidlink-fileservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: lucidlink-fileservice
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - MGMT_API_UPSTREAM=http://lucidlink-api:3003
      # /agent/query LLM (OpenAI-compatible chat/completions). Optional: if unset,
      # /agent/query returns 503. Point at any reachable OpenAI-compatible endpoint.
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      # Owner sign-in (Supabase session) and the encrypted token vault.
      # See docs/INDEXER.md.
      - VAULT_KEY=${VAULT_KEY:-}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - OWNER_USER_ID=${OWNER_USER_ID:-}
      - INDEXER_URL=http://lucidlink-indexer:8100
      - INDEXER_INTERNAL_KEY=${INDEXER_INTERNAL_KEY:-}
      # LucidLink update monitor (docs/UPDATES.md). Alerts go to every
      # configured channel; leave all blank to only record them.
      - NTFY_URL=${NTFY_URL:-}
      - NTFY_TOPIC=${NTFY_TOPIC:-}
      - NTFY_TOKEN=${NTFY_TOKEN:-}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - UPDATE_CHECK_INTERVAL_SEC=${UPDATE_CHECK_INTERVAL_SEC:-21600}
      - UPDATES_PIN_DIR=/app/pins
    volumes:
      - lucidlink-data:/data
      # Pin files the image does not contain, so the monitor compares against
      # what is actually declared.
      - ./docker-compose.yml:/app/pins/docker-compose.yml:ro
      - ./requirements.txt:/app/pins/requirements.txt:ro
      - ../.mcp.json:/app/pins/.mcp.json:ro
    depends_on:
      lucidlink-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Delta crawler + search/ask/survey. Not published: reached only through the
  # file service's /index/* proxy. Own SDK client, so crawls never block the UI.
  lucidlink-indexer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: lucidlink-indexer
    restart: unless-stopped
    command: ["uvicorn", "indexer.app:app", "--host", "0.0.0.0", "--port", "8100"]
    environment:
      - VAULT_KEY=${VAULT_KEY:-}
      - INDEXER_INTERNAL_KEY=${INDEXER_INTERNAL_KEY:-}
      - EMBED_BASE_URL=${EMBED_BASE_URL:-}
      - EMBED_MODEL=${EMBED_MODEL:-}
      - EMBED_API_KEY=${EMBED_API_KEY:-}
      - RUVECTOR_URL=${RUVECTOR_URL:-}
      - RUVECTOR_API_KEY=${RUVECTOR_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-180}
      - SYNC_INTERVAL_SEC=${SYNC_INTERVAL_SEC:-300}
      - INDEX_MAX_FILE_BYTES=${INDEX_MAX_FILE_BYTES:-26214400}
      # Connected block storage (docs/INDEXER.md, In Place, Phase A).
      - BLOCK_SOURCES=${BLOCK_SOURCES:-}
      - BLOCK_SOURCE_WORKSPACE=${BLOCK_SOURCE_WORKSPACE:-}
    volumes:
      - lucidlink-data:/data
      # A NAS share / drive indexed in place, read-only. Unset: an empty
      # placeholder is mounted and nothing is indexed.
      - ${BLOCK_SOURCE_PATH:-./block-empty}:/block/source1:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  lucidlink-data:
