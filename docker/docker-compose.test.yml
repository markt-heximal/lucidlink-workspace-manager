services:
  lucidlink-api:
    image: lucidlink/lucidlink-api:1.5.7@sha256:78d705e2c62b0572981a73fa599405e2f465d15e6f038a2b971a4ce417225297
    container_name: lucidlink-api-test
    restart: unless-stopped
    ports:
      - "3004:3003"
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:3003/api/v1/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  lucidlink-fileservice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: lucidlink-fileservice-test
    restart: unless-stopped
    ports:
      - "8002:8000"
    environment:
      - MGMT_API_UPSTREAM=http://lucidlink-api:3003
    depends_on:
      lucidlink-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
