# CI for the engine (docker/). This is the gate Renovate waits for before it
# automerges a patch (or a >=1.x minor) update; see renovate.json and
# docs/UPDATES.md. Keep the job names stable: branch protection, if enabled,
# refers to them ("tests", "image").
name: ci

on:
  pull_request:
  push:
    branches: [main, "renovate/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The lucidlink SDK ships only a manylinux x86_64 wheel for Linux, which
    # ubuntu-latest (x86_64) installs natively.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # same line as the image (python:3.12-slim)
          cache: pip
          cache-dependency-path: docker/requirements.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docker/requirements.txt pytest

      - name: SDK smoke import
        # Fails fast, with a clear message, when a bump changes the package
        # layout (1.0 removed most top-level modules).
        run: |
          python -c "import lucidlink, sys; print('lucidlink', lucidlink.__version__); sys.exit(0)"
          python -c "from lucidlink import Client, ServiceAccountCredentials, StorageConfig; print('core API ok')"

      - name: Tests
        run: python -m pytest docker/tests -q

  image:
    # Builds the engine image exactly as the Mini does (linux/amd64), so a pin
    # that does not install, or a Dockerfile that no longer matches the tree,
    # fails here rather than during the redeploy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --platform linux/amd64 --build-arg GIT_SHA=${GITHUB_SHA::7} -t lucidlink-engine:ci docker
      - name: Import check inside the image
        run: |
          docker run --rm --platform linux/amd64 lucidlink-engine:ci \
            python -c "import lucidlink_api, lucidlink; print('engine imports ok, sdk', lucidlink.__version__)"
